<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Acme Corp</title>
  <meta name="description" content="Get in touch with Acme Corp support and sales teams for questions about products, orders, or partnerships.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Contact Us | Acme Corp">
  <meta property="og:description" content="Get in touch with Acme Corp support and sales teams.">
  <meta property="og:image" content="https://acmecorp.example.com/images/hero.jpg">
  <link rel="canonical" href="https://acmecorp.example.com/contact.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact Our Team</h1>

    <form action="/submit" method="post">
      <div>
        <label for="contact-name">Full Name</label>
        <input type="text" id="contact-name" name="name" placeholder="Your name" required>
      </div>
      <div>
        <label for="contact-email">Email Address</label>
        <input type="email" id="contact-email" name="email" placeholder="Your email" required>
      </div>
      <div>
        <label for="contact-phone">Phone Number</label>
        <input type="tel" id="contact-phone" name="phone" placeholder="Phone number">
      </div>
      <div>
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" placeholder="Your message" required></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>

    <h2>Office Location</h2>
    <p>123 Widget Street, Innovation City, CA 94000</p>
  </main>

  <footer>
    <p>&copy; 2024 Acme Corp</p>
  </footer>
</body>
</html>
